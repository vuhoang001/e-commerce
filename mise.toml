# Pins every toolchain in this repo. `mise install` after cloning is the only setup step.
# Adding a language here is a deliberate act — see PLAN.md section 3 before doing it.

[tools]
dotnet = "10.0"
buf    = "latest"
# Uncomment each as its phase arrives (PLAN.md section 8):
# go     = "1.24"      # month 2
# python = "3.12"      # month 3
# java   = "temurin-21" # month 4
# k6     = "latest"    # month 6

[env]
_.file = ".env"

[tasks.setup]
description = "First-run setup after clone"
run = ["mise install", "cp -n .env.example .env || true"]
